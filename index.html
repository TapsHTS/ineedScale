<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Balance BS444</title>
<style>
:root{--bg:#F2F3F8;--sf:#fff;--sf2:#F4F5FA;--bd:#E8EAF1;--t1:#14151B;--t2:#6C7080;--t3:#A5A9B8;--ac:#6558F5;--acs:#ECEAFE;--g:#2EBF6B;--gs:#E3F7EB;--o:#F59E0B;--os:#FEF1DB}
@media(prefers-color-scheme:dark){:root{--bg:#0A0B10;--sf:#16171E;--sf2:#1F212A;--bd:#262833;--t1:#F5F6FA;--t2:#9A9EAD;--t3:#5C6070;--ac:#7B6FFF;--acs:#25234A;--g:#3DD17A;--gs:#15321F;--o:#FBB13C;--os:#3A2B10}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--t1)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:430px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 20px 120px}
.page{display:none;flex-direction:column;gap:12px}.page.on{display:flex}
.row{display:flex;justify-content:space-between;align-items:center}
small,.sub{font-size:12px;font-weight:500;color:var(--t2)}
.hd small{font-size:13px}.hd h1{font-size:28px;letter-spacing:-.03em;margin-top:2px}
.pill{display:flex;gap:6px;align-items:center;padding:7px 12px 7px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--sf2);color:var(--t2)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{background:var(--gs);color:var(--g)}.pill.busy{background:var(--os);color:var(--o)}
.card{background:var(--sf);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--ac);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#fff}
.hero:before{width:210px;height:210px;right:-45px;top:-80px;opacity:.1}
.hero:after{width:150px;height:150px;left:-50px;bottom:-30px;opacity:.07}
.hero>*{position:relative;z-index:1}
.hero .row span{font-size:13px;font-weight:500;opacity:.8}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1.1}
.big u{text-decoration:none;font-size:22px;font-weight:600;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:20px;font-size:13px;font-weight:600;background:rgba(255,255,255,.22)}
.sp svg{display:block;width:100%;height:auto}
.days{display:flex;justify-content:space-between;padding:0 6px;font-size:11px;font-weight:500;opacity:.65}
.ib{width:36px;height:36px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.gl{display:flex;gap:10px;align-items:center}.gl b{font-size:17px;display:block}
.tag{padding:6px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--acs);color:var(--ac)}
.tr{height:10px;border-radius:6px;background:var(--sf2);overflow:hidden}.tr i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .5s}
.goal .row:last-child{font-size:12px;font-weight:500;color:var(--t2)}.goal .row b{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--sf);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini .ib{width:28px;height:28px}
.mini .top{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500;color:var(--t2)}
.mini .bot{display:flex;justify-content:space-between;align-items:center}
.mini b{font-size:26px;letter-spacing:-.03em}.mini b small{font-size:14px;margin-left:3px;letter-spacing:0}
.dl{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600}
.dl.g{color:var(--g)}.dl.o{color:var(--o)}.dl.n{color:var(--t2)}
.sync{height:52px;border-radius:26px;background:var(--t1);color:var(--sf);font-weight:600;font-size:16px;display:flex;gap:8px;justify-content:center;align-items:center}
.sync:disabled{opacity:.6}.sync.spin svg{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.st{text-align:center;font-size:13px;color:var(--t2)}
.sect{display:flex;justify-content:space-between;padding:4px 4px 0;font-size:14px;font-weight:600}.sect span{font-size:12px;font-weight:500;color:var(--t3)}
.list{background:var(--sf);border-radius:24px;padding:4px 16px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}.item:first-child{border:0}
.dt{width:38px;text-align:center;font-size:20px;font-weight:700;line-height:1.1}.dt small{display:block;font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.04em}
.item>div:nth-child(2){flex:1}.item b{font-size:17px}.item .sub{display:block;margin-top:1px}
.dc{padding:4px 8px;border-radius:12px;background:var(--sf2);font-size:12px;font-weight:600;display:inline-flex;gap:3px;align-items:center;color:var(--t2)}
.dc.g{background:var(--gs);color:var(--g)}.dc.o{background:var(--os);color:var(--o)}
.circle{width:42px;height:42px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.empty{text-align:center;padding:28px 16px;color:var(--t2);font-size:14px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 32px);max-width:398px;display:flex;justify-content:space-between;padding:8px;background:var(--sf);border:1px solid var(--bd);border-radius:32px;box-shadow:0 8px 24px rgba(25,25,76,.1)}
.tab{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:24px;color:var(--t3);font-size:10.5px;font-weight:500}
.tab.on{background:var(--acs);color:var(--ac);font-weight:600}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-80px);background:var(--t1);color:var(--sf);padding:10px 16px;border-radius:16px;font-size:14px;font-weight:600;transition:transform .3s;z-index:9;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.seg{display:flex;gap:2px;padding:4px;background:var(--sf);border-radius:24px}.seg button{flex:1;padding:9px 0;border-radius:20px;font-size:14px;font-weight:500;color:var(--t2)}.seg .on{background:var(--ac);color:#fff;font-weight:600}
.chips{display:flex;justify-content:space-between;gap:6px}.chips button{padding:8px 10px;border-radius:18px;background:var(--sf);font-size:13px;font-weight:600;color:var(--t2)}.chips .on{background:var(--t1);color:var(--sf)}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{background:var(--sf);border-radius:20px;padding:12px}.tile b{display:block;font-size:19px;letter-spacing:-.02em}
.tag.g{background:var(--gs);color:var(--g)}.tag.o{background:var(--os);color:var(--o)}
.bar{position:relative;height:16px}.bar i{position:absolute;top:5px;height:6px;border-radius:3px}.bar u{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--sf);box-sizing:content-box;transform:translate(-3px,-3px)}
.bmi b{font-size:38px;letter-spacing:-.04em}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:8}.sheet.on{display:flex}
.sheet>div{width:100%;max-width:430px;margin:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cells div{background:var(--sf2);border-radius:16px;padding:10px}.cells b{display:block;font-size:17px}
textarea,input[type=datetime-local]{width:100%;border:1px solid var(--bd);border-radius:14px;padding:10px;background:var(--sf2);color:var(--t1);font:inherit}
.btn{height:48px;border-radius:24px;font-weight:600;font-size:16px}.btn.p{background:var(--ac);color:#fff}.btn.d{color:#EF4444}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd);cursor:pointer}.rw:first-of-type{border:0}.rw small{display:block}.rw>span:last-child{color:var(--ac);font-weight:600;font-size:14px}
.av{width:56px;height:56px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:24px;font-weight:700}
</style>
</head>
<body>
<div class="app">

<section class="page on" id="p-home">
  <div class="row hd"><div><small id="hdate"></small><h1 id="hello"></h1></div><div class="pill" id="ble"><i></i><span>BS444</span></div></div>
  <div class="hero">
    <div class="row"><span>Dernière pesée</span><span id="wt"></span></div>
    <div class="row"><div class="big"><b id="w">--,-</b><u>kg</u></div><div class="chip" id="dl" hidden></div></div>
    <div class="sp" id="sp"></div><div class="days" id="dy"></div>
  </div>
  <div class="card goal" id="goal">
    <div class="row"><div class="gl"><div class="ib" data-i="target" data-s="18"></div><div><small>Objectif</small><b id="gv"></b></div></div><span class="tag" id="gr"></span></div>
    <div class="tr"><i id="gb"></i></div>
    <div class="row"><span id="g0"></span><b id="gp"></b><span id="g1"></span></div>
  </div>
  <div class="grid" id="mini"></div>
  <button class="sync" id="sync"><span data-i="refresh" data-s="18" data-w="2.3"></span><span>Synchroniser la balance</span></button>
  <p class="st" id="st">Pèse-toi d'abord, puis appuie sur « Synchroniser la balance ».</p>
</section>

<section class="page" id="p-evo">
  <div class="hd"><small>Suivi détaillé</small><h1>Évolution</h1></div>
  <div class="seg" id="ep"></div><div class="chips" id="em"></div>
  <div class="card"><div class="row"><div><small id="el"></small><div class="big"><b id="ev" style="font-size:34px"></b><u id="eu" style="font-size:16px;color:var(--t2)"></u></div></div><span class="tag" id="ed"></span></div><div class="chart" id="cv"></div></div>
  <div class="tiles" id="et"></div><div class="card" id="ei" hidden></div>
</section>

<section class="page" id="p-body">
  <div class="hd"><small>Composition corporelle</small><h1>Corps</h1></div>
  <div class="card bmi" id="bm"></div><div class="grid" id="bg"></div><div class="card" id="bk"></div><p class="st" id="bn"></p>
</section>

<section class="page" id="p-hist">
  <div class="row hd"><div><small>Toutes les pesées</small><h1>Historique</h1></div><button class="circle" id="exp" aria-label="Exporter en CSV" data-i="download"></button></div>
  <div class="chips" id="hf" style="justify-content:flex-start;gap:8px"></div>
  <div id="hl"></div>
</section>

<section class="page" id="p-me">
  <div class="hd"><small>Votre espace personnel</small><h1>Profil</h1></div>
  <div id="mc" style="display:flex;flex-direction:column;gap:12px"></div>
</section>

</div>
<input type="file" id="imp" accept=".csv,text/csv" hidden>
<div class="sheet" id="sheet"><div>
  <div class="row"><div><small id="sh-d0"></small><div class="big"><b id="sh-w" style="font-size:34px"></b></div></div><button class="circle" id="sh-x" aria-label="Fermer">✕</button></div>
  <div class="cells" id="sh-c"></div>
  <small>Date et heure</small><input type="datetime-local" id="sh-d">
  <small>Note</small><textarea id="sh-n" rows="2" placeholder="À jeun, après sport…"></textarea>
  <button class="btn p" id="sh-s">Enregistrer</button><button class="btn d" id="sh-r">Supprimer cette pesée</button>
</div></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>

<script>
const K = "medisana_bs444_records", KS = "bs444_settings";
const SVC = "000078b2-0000-1000-8000-00805f9b34fb";
const CW = "00008a21-0000-1000-8000-00805f9b34fb";   // poids
const CB = "00008a22-0000-1000-8000-00805f9b34fb";   // composition
const CC = "00008a81-0000-1000-8000-00805f9b34fb";   // commande
const $ = s => document.querySelector(s);

/* ---------- Stockage ---------- */
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { toast("Stockage indisponible") } };
const records = () => get(K, []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
const settings = () => ({ name: "Clément", goal: 75, ...get(KS, {}) });
const fm = (v, d = 1) => v == null ? "--" : Number(v).toFixed(d).replace(".", ",");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Icônes ---------- */
const I = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  trend: '<path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/>',
  activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>', up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  droplet: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  bone: '<path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>'
};
const ic = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const hydrate = () => document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = ic(e.dataset.i, +e.dataset.s || 20, +e.dataset.w || 2));

/* ---------- Navigation ---------- */
const TABS = [["home", "Accueil", "home"], ["evo", "Évolution", "trend"], ["body", "Corps", "activity"], ["hist", "Historique", "history"], ["me", "Profil", "user"]];
$("#tabs").innerHTML = TABS.map(([k, l, i]) => `<button class="tab" data-p="${k}">${ic(i, 22)}<span>${l}</span></button>`).join("");
function show(p) {
  document.querySelectorAll(".page").forEach(e => e.classList.toggle("on", e.id === "p-" + p));
  document.querySelectorAll(".tab").forEach(e => e.classList.toggle("on", e.dataset.p === p));
  scrollTo(0, 0); history.replaceState(null, "", "#" + p);
}
$("#tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) show(t.dataset.p) };

let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3200) }

/* ---------- Accueil ---------- */
function spark(v) {
  if (v.length < 2) return "";
  const W = 310, H = 58, p = 8, mn = Math.min(...v), r = (Math.max(...v) - mn) || 1;
  const P = v.map((y, i) => [p + i * (W - 2 * p) / (v.length - 1), p + (1 - (y - mn) / r) * (H - 2 * p)]);
  let d = "M" + P[0];
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i - 1] || P[i], b = P[i], c = P[i + 1], e = P[i + 2] || c;
    d += ` C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c}`;
  }
  const l = P[P.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="${d} L${l[0]},${H} L${P[0][0]},${H}Z" fill="url(#gr)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="${l[0]}" cy="${l[1]}" r="5" fill="#fff" stroke="var(--ac)" stroke-width="3"/></svg>`;
}
function dayLabel(iso) {
  const d = new Date(iso), n = new Date(), s = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const k = Math.round((s(n) - s(d)) / 864e5), t = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return k === 0 ? `Aujourd'hui · ${t}` : k === 1 ? `Hier · ${t}` : `${d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} · ${t}`;
}
const MINI = [["fat", "flame", "Graisse", "%", 0], ["water", "droplet", "Eau", "%", 1], ["muscle", "zap", "Muscle", "%", 1], ["bone", "bone", "Os", "kg", null]];
function renderHome() {
  const R = records(), s = settings(), cur = R[0], prev = R[1];
  $("#hdate").textContent = cap(new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
  $("#hello").textContent = "Bonjour" + (s.name ? " " + s.name : "");
  $("#w").textContent = cur ? fm(cur.weight) : "--,-";
  $("#wt").textContent = cur ? dayLabel(cur.timestamp) : "Aucune pesée";
  const dl = $("#dl");
  if (cur && prev) {
    const d = cur.weight - prev.weight;
    dl.hidden = false; dl.innerHTML = Math.abs(d) < .05 ? "stable" : `${ic(d < 0 ? "down" : "up", 13, 2.4)}${fm(Math.abs(d))} kg`;
  } else dl.hidden = true;
  const last = R.slice(0, 7).reverse();
  $("#sp").innerHTML = spark(last.map(r => r.weight));
  $("#dy").innerHTML = last.length > 1 ? last.map(r => `<span>${"DLMMJVS"[new Date(r.timestamp).getDay()]}</span>`).join("") : "";
  // objectif : départ = toute première pesée enregistrée
  $("#gv").textContent = fm(s.goal) + " kg";
  const g = s.goal, start = R.length ? R[R.length - 1].weight : null;
  let pct = 0;
  if (cur && start != null && start !== g) pct = Math.max(0, Math.min(1, (start - cur.weight) / (start - g)));
  $("#gb").style.width = Math.round(pct * 100) + "%";
  $("#gp").textContent = Math.round(pct * 100) + " %";
  $("#g0").textContent = "Départ " + (start != null ? fm(start) + " kg" : "--");
  $("#g1").textContent = "Cible " + fm(g) + " kg";
  $("#gr").textContent = cur ? (Math.abs(cur.weight - g) < .05 ? "Objectif atteint" : fm(Math.abs(cur.weight - g)) + " kg restants") : "—";
  $("#mini").innerHTML = MINI.map(([k, i, l, u, good]) => {
    const pv = R.slice(1).find(r => r[k] != null);
    let dh = "";
    if (cur && cur[k] != null && pv) {
      const d = cur[k] - pv[k];
      if (Math.abs(d) < .05) dh = `<span class="dl n">stable</span>`;
      else dh = `<span class="dl ${good === null ? "n" : (d < 0) === (good === 0) ? "g" : "o"}">${ic(d < 0 ? "down" : "up", 12, 2.6)}${fm(Math.abs(d))}</span>`;
    }
    return `<div class="mini"><div class="top"><div class="ib" >${ic(i, 15)}</div>${l}</div><div class="bot"><b>${cur ? fm(cur[k]) : "--"}<small>${u}</small></b>${dh}</div></div>`;
  }).join("");
}

/* ---------- Outils communs ---------- */

const MET = { weight: ["Poids", "kg", 0], fat: ["Graisse", "%", 0], water: ["Eau", "%", 1], muscle: ["Muscle", "%", 1], bone: ["Os", "kg", null], bmi: ["IMC", "", 0] };

/* ---------- Évolution ---------- */
const evo = { p: "1M", m: "weight" }, PER = { "7J": 7, "1M": 30, "3M": 90, "1A": 365, "Tout": 1e5 };
function renderEvo() {

  $("#em").innerHTML = Object.entries(MET).map(([k, m]) => `<button data-k="${k}" class="${k === evo.m ? "on" : ""}">${m[0]}</button>`).join("");
  const P = records().reverse().filter(r => now - new Date(r.timestamp) <= PER[evo.p] * 864e5 && val(r, evo.m) != null).map(r => ({ t: +new Date(r.timestamp), v: val(r, evo.m) }));
  $("#el").textContent = lab + " · " + (evo.p === "Tout" ? "tout l'historique" : evo.p); $("#eu").textContent = u;
  const clear = m => { $("#cv").innerHTML = `<div class="empty">${m}</div>`; $("#ev").textContent = P.length ? fm(P[P.length - 1].v) : "--"; $("#ed").hidden = true; $("#et").innerHTML = ""; $("#ei").hidden = true };
  if (evo.m === "bmi" && !s.height) return clear("Renseigne ta taille dans Profil pour calculer l'IMC.");
  if (P.length < 2) return clear("Pas assez de pesées sur cette période.");

  const goal = evo.m === "weight" ? s.goal : null;
  const W = 330, H = 230, X0 = 34, X1 = W - 8, Y0 = 10, Y1 = H - 26;

  const pad = (hi - lo) * .12 || 1; lo -= pad; hi += pad;
  const t0 = P[0].t, t1 = P[n].t, x = t => X0 + (t - t0) / ((t1 - t0) || 1) * (X1 - X0), y = v => Y0 + (hi - v) / (hi - lo) * (Y1 - Y0);
  const TP = T.map((v, i) => [x(P[i].t), y(v)]), d = curve(TP);

  if (goal != null) g += `<line x1="${X0 - 2}" x2="${X1 + 6}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X1 + 6}" y="${y(goal) - 5}" font-size="10.5" font-weight="600" fill="var(--g)" text-anchor="end">Objectif ${fm(goal)}</text>`;

  $("#cv").innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".28"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>${g}${P.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.5" fill="var(--ac)" opacity=".35"/>`).join("")}<path d="${d} L${TP[n][0]},${Y1} L${TP[0][0]},${Y1}Z" fill="url(#ga)"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round"/><g id="mk"><line stroke="var(--ac)" stroke-opacity=".4" stroke-width="1.5"/><circle r="6" fill="var(--sf)" stroke="var(--ac)" stroke-width="3.5"/><rect width="76" height="38" rx="11" fill="var(--t1)"/><text font-size="13" font-weight="700" fill="var(--sf)"></text><text font-size="10.5" fill="var(--sf)" opacity=".7"></text></g>${xl}</svg>`;
  const mk = $("#mk"), mark = i => {
    const px = x(P[i].t), py = TP[i][1], ln = mk.querySelector("line"), ci = mk.querySelector("circle"), rc = mk.querySelector("rect"), tx = mk.querySelectorAll("text"), bx = Math.min(Math.max(px - 38, 2), W - 78), by = Math.max(2, py - 52);
    ln.setAttribute("x1", px); ln.setAttribute("x2", px); ln.setAttribute("y1", py); ln.setAttribute("y2", Y1); ci.setAttribute("cx", px); ci.setAttribute("cy", py);
    rc.setAttribute("x", bx); rc.setAttribute("y", by); tx[0].setAttribute("x", bx + 10); tx[0].setAttribute("y", by + 16); tx[1].setAttribute("x", bx + 10); tx[1].setAttribute("y", by + 30);

  };
  mark(n);
  const svg = $("#cv svg"), pick = e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W; let b = 0; P.forEach((p, i) => { if (Math.abs(x(p.t) - px) < Math.abs(x(P[b].t) - px)) b = i }); mark(b) };
  svg.onpointerdown = svg.onpointermove = pick;
  const first = P[0].v, last = P[n].v, dd = dlt(last - first, good);
  $("#ev").textContent = fm(last); $("#ed").hidden = false; $("#ed").className = "tag " + dd.c; $("#ed").textContent = dd.t === "stable" ? "stable" : dd.t + " " + (u || "");
  const vs = P.map(p => p.v), tl = (l, v, c) => `<div class="tile"><small>${l}</small><b${c ? ` style="color:var(--${c})"` : ""}>${v}</b></div>`;

/* ---------- Corps ---------- */
const REF = { m: { fat: [5, 40, 8, 20], water: [40, 70, 50, 65], muscle: [25, 55, 36, 50], bone: [1.5, 5, 2.6, 3.8] }, f: { fat: [5, 45, 21, 33], water: [35, 65, 45, 60], muscle: [20, 50, 28, 42], bone: [1, 4, 1.9, 3.1] } };

/* ---------- Historique ---------- */
let hf = "all", sid = null;

$("#hf").onclick = e => { const k = e.target.dataset.k; if (k) { hf = k; renderHist() } };

    `<div class="card" style="gap:0"><b>Données et suivi</b><div class="rw" data-a="exp"><span>Exporter les données<small>Fichier CSV</small></span><span>›</span></div><div class="rw" data-a="imp"><span>Importer les données<small>Fichier CSV exporté par l'app</small></span><span>›</span></div></div>`;

const ACT = {

  height() { const v = prompt("Taille (cm)", settings().height || ""); if (v === null) return; const n = parseFloat(v.replace(",", ".")); if (!(n > 100 && n < 250)) return toast("Entre une taille valide, par exemple 178"); setS({ height: n }); renderAll() },
  birth() { const v = prompt("Date de naissance (JJ/MM/AAAA)", ""); if (v === null) return; const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m || isNaN(new Date(`${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`))) return toast("Format attendu : JJ/MM/AAAA"); setS({ birth: `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` }); renderAll() },

const csv = l => { const o = []; let c = "", q = 0; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ";" && !q) { o.push(c); c = "" } else c += ch } o.push(c); return o };

};

const renderAll = () => { renderHome(); renderEvo(); renderBody(); renderHist(); renderMe() };

/* ---------- Bluetooth (logique issue du fichier de base) ---------- */
function setBle(state, label) { const b = $("#ble"); b.className = "pill " + state; b.querySelector("span").textContent = label; if (typeof renderMe === "function") renderMe() }
let cur = null, saveT;   // pesée en cours (créée au clic, comme dans la version d'origine)
const newRec = () => ({ id: crypto.randomUUID ? crypto.randomUUID() : "id_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11), timestamp: new Date().toISOString(), weight: null, fat: null, water: null, muscle: null, bone: null, kcal: null, userId: null });
function commit() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if (cur && cur.weight !== null) {
      const list = records(); list.unshift(cur); put(K, list);
      toast(`Pesée enregistrée : ${fm(cur.weight)} kg`); $("#st").textContent = "Mesure enregistrée avec succès !";
      cur = null; renderAll();
    }
  }, 2000);
}
function onWeight(v) {
  if (!cur) cur = newRec();
  cur.weight = parseFloat((v.getUint16(1, true) / 100).toFixed(2));
  cur.userId = v.getUint8(13);
  $("#w").textContent = fm(cur.weight); $("#wt").textContent = "Pesée reçue…";
  commit();
}
function onBody(v) {
  if (!cur) cur = newRec();
  const f = o => parseFloat(((v.getUint16(o, true) & 0x0fff) / 10).toFixed(1));
  cur.kcal = v.getUint16(6, true); cur.fat = f(8); cur.water = f(10); cur.muscle = f(12); cur.bone = f(14);
  commit();
}

async function sync() {
  const btn = $("#sync"), st = $("#st");
  if (!navigator.bluetooth) { st.textContent = "Web Bluetooth indisponible : ouvre cette page dans Bluefy."; return toast("Ouvre la page dans Bluefy") }
  cur = newRec(); btn.disabled = true; btn.classList.add("spin"); setBle("busy", "Recherche…"); st.textContent = "Recherche de la balance…";
  try {
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "02" }, { namePrefix: "BS44" }, { namePrefix: "Medisana" }, { services: [SVC] }],
      optionalServices: [SVC]
    });
    dev.addEventListener("gattserverdisconnected", () => { setBle("", "BS444"); btn.disabled = false; btn.classList.remove("spin") });
    st.textContent = "Connexion BLE en cours…";
    const svc = await (await dev.gatt.connect()).getPrimaryService(SVC);
    const cw = await svc.getCharacteristic(CW); await cw.startNotifications();
    cw.addEventListener("characteristicvaluechanged", e => { try { onWeight(e.target.value) } catch (x) { toast("Erreur poids : " + x.message) } });
    const cb = await svc.getCharacteristic(CB); await cb.startNotifications();
    cb.addEventListener("characteristicvaluechanged", e => { try { onBody(e.target.value) } catch (x) { toast("Erreur composition : " + x.message) } });
    // Handshake d'origine (octets magiques Transtek/Medisana)
    try {
      await (await svc.getCharacteristic(CC)).writeValue(new Uint8Array([0x02, 0x7b, 0x7b, 0xf6, 0x0d]));
    } catch (err) { console.warn("Handshake CMD optionnel :", err) }
    setBle("on", "Connectée"); st.textContent = "Connectée ! Récupération de ta pesée…";
    setTimeout(() => { if (cur && cur.weight === null) st.textContent = "Aucune pesée reçue. Pèse-toi d'abord (attends la fin de l'affichage), puis relance la synchronisation." }, 8000);
  } catch (err) {
    setBle("", "BS444"); btn.disabled = false; btn.classList.remove("spin");
    st.textContent = err.name === "NotFoundError" ? "Aucune balance sélectionnée." : "Erreur : " + err.message;
  }
}
$("#sync").onclick = sync;

hydrate(); renderAll();
show(TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "home");
</script>
</body>
